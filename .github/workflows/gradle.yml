# https://docs.github.com/en/actions/tutorials/build-and-test-code/java-with-gradle
name: Gradle Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
    #inputs:

permissions:
  #contents: read
  contents: write # The Dependency Submission API requires write permission

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-java@v6
      with:
        java-version: '21'
        distribution: 'temurin'

    - uses: gradle/actions/setup-gradle@v6

    - name: Build with Gradle
      run: ./gradlew --show-version build javadoc

    - uses: actions/upload-artifact@v7
      with:
        name: mousegen-build
        overwrite: true
        compression-level: 0
        path: |
          mousegen/build/distributions/mousegen.cmd
          mousegen/build/distributions/mousegen.sh
          mousegen/build/libs/mousegen-*-shaded.jar

    - uses: gradle/actions/dependency-submission@v6

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.
# This workflow will build a Java project with Gradle and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-gradle

name: Java CI with Gradle

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
    #inputs:

permissions:
  #contents: read
  contents: write # The Dependency Submission API requires write permission

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6
    - uses: actions/setup-java@v5
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v6

    - name: Build with Gradle
      run: ./gradlew --show-version build javadoc

    - uses: actions/upload-artifact@v7
      with:
        name: mousegen-build
        overwrite: true
        compression-level: 0
        path: |
          mousegen/build/distributions/mousegen.cmd
          mousegen/build/distributions/mousegen.sh
          mousegen/build/libs/mousegen-*-shaded.jar

    - uses: gradle/actions/dependency-submission@v6
